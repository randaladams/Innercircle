name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # true once the Google Play upload key has been added under Settings > Secrets and variables > Actions
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Uses the Gradle version pinned by the wrapper (gradle/wrapper/gradle-wrapper.properties)
      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v6
        with:
          name: InnerCircle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}

      # Always builds the release bundle (so R8 problems show up early); it is signed only when the key exists.
      - name: Build release bundle for Google Play
        shell: bash
        run: ./gradlew bundleRelease 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}
        env:
          UPLOAD_KEYSTORE_PATH: ${{ env.HAS_UPLOAD_KEY == 'true' && format('{0}/upload.p12', runner.temp) || '' }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v6
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: InnerCircle-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # If the build fails, surface the compiler/Gradle errors as annotations on the run
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|> |Could not" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
